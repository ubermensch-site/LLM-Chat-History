name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'release/**'
      - 'review/**'
      - 'test/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for release E2E
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Verify extension bundle
        run: npm run verify:dist

      - name: Automated release scenarios
        run: xvfb-run -a npm run test:e2e

      - name: Upload automated release QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: llm-chat-history-automated-qa-${{ github.sha }}
          path: |
            release-qa-automated.json
            release-qa-library-light.png
            release-qa-library-dark.png
            release-qa-library-settings.png
          if-no-files-found: error
          retention-days: 30

      - name: Package release ZIP
        run: npm run package:release

      - name: Verify release ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip_path="release/llm-chat-history-v$(node -p "require('./package.json').version").zip"
          test -f "$zip_path"
          test -f "$zip_path.sha256"
          unzip -t "$zip_path"
          unzip -Z1 "$zip_path" | sort > release/zip-contents.txt
          ! grep -E '\.map$' release/zip-contents.txt
          grep -Fx 'manifest.json' release/zip-contents.txt
          grep -Fx 'background.js' release/zip-contents.txt
          grep -Fx 'content.js' release/zip-contents.txt
          grep -Fx 'library.js' release/zip-contents.txt
          grep -Fx 'library.html' release/zip-contents.txt
          (cd release && sha256sum -c "$(basename "$zip_path").sha256")

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: llm-chat-history-unpacked-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload release candidate package
        uses: actions/upload-artifact@v4
        with:
          name: llm-chat-history-v0.1-release-${{ github.sha }}
          path: |
            release/*.zip
            release/*.sha256
            release/zip-contents.txt
          if-no-files-found: error
          retention-days: 30
