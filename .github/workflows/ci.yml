name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Verify extension bundle
        run: npm run verify:dist

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: llm-chat-history-unpacked-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
