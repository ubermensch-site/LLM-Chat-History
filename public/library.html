<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LLM Chat History</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Roboto, Arial, sans-serif;
      --primary: #6750a4;
      --on-primary: #ffffff;
      --surface: #fffbfe;
      --surface-container: #f3edf7;
      --surface-container-high: #ece6f0;
      --on-surface: #1d1b20;
      --on-surface-variant: #49454f;
      --outline: #79747e;
      --outline-variant: #cac4d0;
      --error: #b3261e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--surface); color: var(--on-surface); }
    button, input { font: inherit; }
    .app { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; min-height: 100vh; }
    .sidebar { border-right: 1px solid var(--outline-variant); background: var(--surface-container); padding: 20px 14px; }
    .brand { font-size: 20px; font-weight: 700; margin: 0 8px 16px; }
    .search { width: 100%; min-height: 44px; border: 1px solid var(--outline); border-radius: 24px; padding: 0 16px; background: var(--surface); color: var(--on-surface); outline: none; }
    .search:focus { border: 2px solid var(--primary); }
    .count { margin: 10px 10px 8px; font-size: 12px; color: var(--on-surface-variant); }
    .list { display: grid; gap: 6px; }
    .conversation { width: 100%; text-align: left; border: 0; border-radius: 14px; padding: 12px; background: transparent; color: inherit; cursor: pointer; }
    .conversation:hover { background: var(--surface-container-high); }
    .conversation.selected { background: #e8def8; color: #1d192b; }
    .conversation-title { display: block; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conversation-meta { display: block; margin-top: 4px; font-size: 12px; color: var(--on-surface-variant); }
    main { min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 18px 24px; border-bottom: 1px solid var(--outline-variant); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); }
    .heading { min-width: 0; }
    .heading h1 { margin: 0; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .heading p { margin: 4px 0 0; font-size: 12px; color: var(--on-surface-variant); }
    .action-block { display: grid; justify-items: end; gap: 6px; max-width: min(520px, 55vw); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .button { min-height: 38px; border: 1px solid var(--outline); border-radius: 20px; padding: 0 14px; background: var(--surface); color: var(--on-surface); cursor: pointer; font-weight: 600; }
    .button.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
    .button:disabled { opacity: .45; cursor: default; }
    .button:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 45%, transparent); outline-offset: 2px; }
    .import-status { margin: 0; min-height: 16px; font-size: 11px; color: var(--on-surface-variant); text-align: right; line-height: 1.35; overflow-wrap: anywhere; }
    .import-status.error { color: var(--error); }
    .visually-hidden { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .transcript { max-width: 900px; margin: 0 auto; padding: 24px; }
    .message { margin: 0 0 18px; padding: 16px; border-radius: 18px; background: var(--surface-container); }
    .message.assistant { background: var(--surface); border: 1px solid var(--outline-variant); }
    .role { font-size: 12px; font-weight: 750; color: var(--primary); text-transform: uppercase; letter-spacing: .06em; }
    .time { float: right; font-size: 11px; color: var(--on-surface-variant); }
    .content { margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; font-family: inherit; }
    .partial { margin-top: 8px; font-size: 11px; color: var(--on-surface-variant); }
    .empty { min-height: 55vh; display: grid; place-items: center; text-align: center; color: var(--on-surface-variant); padding: 24px; }
    .state { text-transform: capitalize; }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #d0bcff; --on-primary: #381e72; --surface: #141218;
        --surface-container: #211f26; --surface-container-high: #2b2930;
        --on-surface: #e6e0e9; --on-surface-variant: #cac4d0;
        --outline: #938f99; --outline-variant: #49454f; --error: #f2b8b5;
      }
      .conversation.selected { background: #4a4458; color: #e8def8; }
    }
    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--outline-variant); }
      .topbar { position: static; flex-direction: column; }
      .action-block { justify-items: start; max-width: 100%; }
      .actions { justify-content: flex-start; }
      .import-status { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">LLM Chat History</div>
      <input id="search" class="search" type="search" placeholder="Search chats and messages…" autocomplete="off" aria-label="Search archived chats">
      <div id="count" class="count">Loading…</div>
      <div id="conversation-list" class="list" aria-live="polite"></div>
    </aside>
    <main>
      <header class="topbar">
        <div class="heading">
          <h1 id="title">Local archive</h1>
          <p id="meta">Select a conversation to view it.</p>
        </div>
        <div class="action-block">
          <div class="actions">
            <button id="import-json" class="button" type="button" disabled>Import JSON</button>
            <button id="download-md" class="button primary" type="button" disabled>Download .md</button>
            <button id="download-json" class="button" type="button" disabled>Download JSON</button>
            <input id="import-file" class="visually-hidden" type="file" accept="application/json,.json" aria-label="Choose JSON archive backup">
          </div>
          <p id="import-status" class="import-status" aria-live="polite"></p>
        </div>
      </header>
      <section id="transcript" class="transcript">
        <div class="empty">Your locally recorded conversations will appear here.</div>
      </section>
    </main>
  </div>
  <script src="library.js"></script>
</body>
</html>
